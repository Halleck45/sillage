name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Build binaries
        run: |
          set -eu
          mkdir -p dist
          # Noms sans version : les URLs releases/latest/download/... restent stables.
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS=${target%/*}
            GOARCH=${target#*/}
            CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build -trimpath -ldflags "-s -w" \
              -o "dist/sillage_${GOOS}_${GOARCH}" .
          done
          (cd dist && sha256sum sillage_* > checksums.txt)
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/sillage_*
            dist/checksums.txt
          generate_release_notes: true
      - name: Update Homebrew formula
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          sha() { grep "sillage_$1" dist/checksums.txt | cut -d' ' -f1; }
          git fetch origin main
          git checkout main
          sed -i \
            -e "s|^  version \".*\"|  version \"$version\"|" \
            -e "s|releases/download/v[0-9.]*/sillage_darwin_arm64\"|releases/download/${GITHUB_REF_NAME}/sillage_darwin_arm64\"|" \
            -e "s|releases/download/v[0-9.]*/sillage_darwin_amd64\"|releases/download/${GITHUB_REF_NAME}/sillage_darwin_amd64\"|" \
            -e "s|releases/download/v[0-9.]*/sillage_linux_arm64\"|releases/download/${GITHUB_REF_NAME}/sillage_linux_arm64\"|" \
            -e "s|releases/download/v[0-9.]*/sillage_linux_amd64\"|releases/download/${GITHUB_REF_NAME}/sillage_linux_amd64\"|" \
            Formula/sillage.rb
          python3 - <<EOF
          import re
          shas = {}
          for line in open("dist/checksums.txt"):
              h, name = line.split()
              shas[name] = h
          src = open("Formula/sillage.rb").read()
          for name, h in shas.items():
              if not name.startswith("sillage_"):
                  continue
              src = re.sub(r'(%s"\n      sha256 ")[0-9a-f]+' % re.escape(name), r'\g<1>' + h, src)
          open("Formula/sillage.rb", "w").write(src)
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/sillage.rb
          git diff --cached --quiet || git commit -m "Homebrew formula: ${GITHUB_REF_NAME}"
          git push origin main
