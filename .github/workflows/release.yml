name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Build binaries
        run: |
          set -eu
          mkdir -p dist
          # Noms sans version : les URLs releases/latest/download/... restent stables.
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS=${target%/*}
            GOARCH=${target#*/}
            CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build -trimpath -ldflags "-s -w" \
              -o "dist/sillage_${GOOS}_${GOARCH}" .
          done
          (cd dist && sha256sum sillage_* > checksums.txt)
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/sillage_*
            dist/checksums.txt
          generate_release_notes: true
